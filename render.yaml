services:
  # Django REST API Backend Web Service
  - type: web
    name: novulab-backend
    runtime: python
    buildCommand: cd backend/novulab && pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: cd backend/novulab && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: novulab-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: novulab-frontend
          property: url

  # Vite React Frontend Static Site
  - type: web
    name: novulab-frontend
    runtime: static
    buildCommand: cd navulab-frontend && npm install && npm run build
    staticPublishPath: navulab-frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: novulab-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Render PostgreSQL Database
  - name: novulab-db
    databaseName: novulab
    user: novulab_user
