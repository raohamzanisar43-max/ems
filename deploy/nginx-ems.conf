# Novu Lab EMS — reverse proxy to the Dockerized gunicorn backend (which
# also serves the built React frontend + static files, single service).
#
# Deploy: copy to /etc/nginx/sites-available/ems on the VPS, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`. Once DNS for
# ems.novulabs.net resolves, run `certbot --nginx -d ems.novulabs.net` to
# get HTTPS — it rewrites this file to add the 443 server block and redirect.

server {
    server_name ems.novulabs.net 187.52.122.85;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
